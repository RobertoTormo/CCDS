version: "3.8" #Compose version 3 file format

services:
  node-exporter:
    
    image: prom/node-exporter:v1.10.2

    command:
      # Read kernel metrics from the mounted host /proc
      - '--path.procfs=/host/proc'
      # Read hardware and device information from the mounted host /sys
      - '--path.sysfs=/host/sys'

      # Disable collectors that expect additional host access
      - '--collector.disable-defaults'

      # Collect CPU, memory and system load
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.loadavg'

    volumes:
      # Read-only mounts
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    
    deploy:
      # Run one exporter on every node
      mode: global

      placement:
        constraints:
          - node.platform.os == linux

      restart_policy:
        # Swarm keeps the exporter running if it exits
        condition: any

  prometheus:
    image: prom/prometheus:v3.15.0

    # Allow access to the manager's Docker socket
    user: "0:0"

    configs:
      - source: prometheus_config

        target: /etc/prometheus/prometheus.yml

    volumes:
      - prometheus_data:/prometheus

      # Query the manager's Docker API for Swarm discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro

    deploy:
      replicas: 1

      placement:
        constraints:
          # Swarm discovery requires access to a manager's API
          - node.role == manager

          - node.hostname == balkan1

      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana:13.2.4

    environment:
      # Pass the reader credentials and database name into Grafana
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?Set GRAFANA_DB_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

      # Public browser URL, supplied when deploying
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?Set GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"


      GF_DATASOURCE_POSTGRES_PASSWORD__FILE: /run/secrets/grafana_db_password
      # Read the initial admin password from a Swarm secret
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password

    secrets:
      - grafana_admin_password

      - grafana_db_password

    #Configure connection to prometheus
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml

        #Tells grafana where to find dashboards JSON files
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/default.yaml

      - source: node_overview
        target: /etc/grafana/dashboards/node-overview.json

    volumes:
      # Store Grafana's users, settings and saved dashboards
      - grafana_data:/var/lib/grafana

    deploy:
      replicas: 1

      placement:
        constraints:
          # Keep Grafana attached to the same node's storage
          - node.hostname == balkan1

      labels:
        # Allow the infrastructure's Traefik to discover Grafana
        - "traefik.enable=true"

        # Reach Grafana through their shared network
        - "traefik.docker.network=frontend"

        # Match /grafana and everything beneath /grafana/
        - "traefik.http.routers.stats-grafana.rule=Path(`/grafana`) || PathPrefix(`/grafana/`)"

        # Use the existing HTTP entrypoint
        - "traefik.http.routers.stats-grafana.entrypoints=web"

        # Explicitly connect this router to its backend
        - "traefik.http.routers.stats-grafana.service=stats-grafana"

        # Grafana's container listens on port 3000
        - "traefik.http.services.stats-grafana.loadbalancer.server.port=3000"

      restart_policy:
        condition: any
      
    
    networks:
      # Keep access to Prometheus in the stats project
      - default

      # Allow Grafana to reach the app's PostgreSQL service
      - app_backend
      
      #Allow Traefik to reach Grafana
      - frontend

  blackbox:

    image: prom/blackbox-exporter:v0.29.0
    command:
      # Load our check definitions
      - '--config.file=/etc/blackbox/blackbox.yaml'
    configs:
      - source: blackbox_config
        target: /etc/blackbox/blackbox.yaml

    deploy:

      replicas: 2

      placement:
        # Keep the replicas on separate nodes
        max_replicas_per_node: 1

      restart_policy:
        condition: any

    networks:
      # Allow Prometheus to reach this exporter
      - default
      # Allow the exporter to check the app services
      - app_backend

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6

    command:
      - '--docker_only=true'
      - '--enable_metrics=cpu,memory'

    volumes:
      # Read the host filesystem layout
      - /:/rootfs:ro

      # Read the host's cgroup resource counters
      - /sys:/sys:ro

      # Obtain Docker container names and metadata
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Docker metadata; verify this directory on the real nodes
      - /var/lib/docker:/var/lib/docker:ro

      #TODO: verify source 
      - type: bind
        source: ${CADVISOR_CONTAINERD_SOCKET:?Set CADVISOR_CONTAINERD_SOCKET}
        target: /run/containerd/containerd.sock
        read_only: true

    networks:
      - default

    deploy:
      # Each instance monitors containers on its own node
      mode: global

      placement:
        constraints:
          - node.platform.os == linux

      restart_policy:
        condition: any

# Declare persistent storage managed by Docker
volumes:
  prometheus_data:
  grafana_data:

configs:
  prometheus_config:
    file: ./prometheus.yaml

  grafana_datasource:
    file: ./grafana-datasource.yaml

  # Dashboard discovery settings
  grafana_dashboards:
    file: ./grafana-dashboards.yaml

  # Panels, queries and layout
  node_overview:
    file: ./node-overview.json

  blackbox_config:
    # Supply the check definitions as configuration
    file: ./blackbox-prometheus.yaml

networks:
  default:
    # Private network for communication within the monitoring stack.
    # Deploying as stats creates the network stats_default
    driver: overlay

  frontend:
    # Existing infrastructure network used by Traefik
    external: true

  app_backend:
    # We keep our existing network name, but connect it to production network named backend
    external: true
    name: backend


secrets:
  grafana_admin_password:
    external: true

  grafana_db_password:
    # Shared with the database account-setup service
    external: true