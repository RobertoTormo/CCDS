global:
  # Collect a new sample every 15 seconds.
  scrape_interval: 15s

scrape_configs:

  - job_name: node-exporter

    # DNS discovery: "tasks.<service>" returns one address per running task,
    # so no Docker socket and no manager node are needed.
    dns_sd_configs:
      - names: ['tasks.node-exporter']
        type: A
        port: 9100

    relabel_configs:
      # Readable node label expected by the dashboard (the task address)
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: node
        replacement: '$1'

  - job_name: service-health
    # Blackbox performs checks through its /probe endpoint
    metrics_path: /probe

    static_configs:
      # Check whether the Core API responds.
      - targets: ['http://coreprod_core:5000/']
        labels:
          service: Core API
          module: http_200

      # This endpoint also executes SELECT 1 against PostgreSQL
      - targets: ['http://coreprod_core:5000/health']
        labels:
          service: API database check
          module: http_200

      # Check the public Atenea instance through nginx and TLS
      - targets: ['https://moodle.balkan-ccds.duckdns.org/']
        labels:
          # Match the service label used by the Grafana status card
          service: Atenea
          module: atenea_http

      # Send PING to Redis and require PONG.
      - targets: ['coreprod_redis:6379']
        labels:
          service: Redis
          module: redis_ping

    relabel_configs:
      # Pass the service address to Blackbox as the target parameter
      - source_labels: [__address__]
        target_label: __param_target

      # Select the check definition from blackbox.yaml
      - source_labels: [module]
        target_label: __param_module

      # Preserve the checked address for troubleshooting
      - source_labels: [__param_target]
        target_label: instance

      # Send the scrape request to Blackbox, which performs the check
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: cadvisor

    dns_sd_configs:
      - names: ['tasks.cadvisor']
        type: A
        port: 8080

    relabel_configs:
      # Identify which node owns the reported containers (task address)
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: node
        replacement: '$1'
