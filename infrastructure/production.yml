
version: "3.8"

services:
  core:
    image: 10.0.0.4:5000/app-core:latest
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=frontend"
        - "traefik.http.routers.core.rule=Host(`core.local`)"
        - "traefik.http.routers.core.entrypoints=web"
        - "traefik.http.services.core.loadbalancer.server.port=5000"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend:
        aliases:
          - postgres
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == balkan1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      backend:
        aliases:
          - redis
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == balkan1
      restart_policy:
        condition: on-failure

  static:
    image: httpd:2.4
    volumes:
      - /home/balkan_user1/project/app/static/html:/usr/local/apache2/htdocs:ro
    networks:
      - frontend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == balkan1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=frontend"
        - "traefik.http.routers.static.rule=Host(`static.local`)"
        - "traefik.http.routers.static.entrypoints=web"
        - "traefik.http.services.static.loadbalancer.server.port=80"

  backup:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      BACKUP_DIR: /backups
    volumes:
      - /home/balkan_user1/project/app/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: |
      while true; do
        /bin/sh /usr/local/bin/backup.sh
        sleep 86400
      done
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == balkan1
      restart_policy:
        condition: on-failure

networks:
  frontend:
    external: true
  backend:
    external: true

volumes:
  postgres_data:
    external: true
    name: app_postgres_data
  redis_data:
    external: true
    name: app_redis_data
  backup_data:
    external: true
    name: app_backup_data
