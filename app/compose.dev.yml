
services:
  core:
    build:
      context: ./core
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5001:5000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  static:
    build: ./static
    image: httpd:2.4
    ports:
      - "8081:80"
    restart: unless-stopped

  auto:
    build: ./auto
    environment:
      CORE_URL: http://core:5000
    depends_on:
      - core

  backup:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /usr/local/bin/backup.sh
          sleep 86400
        done
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  grafana-db-setup:
    image: postgres:17
    environment:
      # Administrator credentials are used only to configure the reader account
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

      # Credentials for Grafana's separate account
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?Set GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD}

    volumes:
      - ./setup-grafana-reader.sh:/setup.sh:ro

    # Run the script
    entrypoint: ["/bin/sh", "/setup.sh"]

    depends_on:
      - postgres
      - core

    # Exit after setup
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  backup_data:
